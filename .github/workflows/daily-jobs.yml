name: Daily Jobs

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      full_run:
        description: 'Run full search matrix (all locations x all roles)'
        required: false
        default: false
        type: boolean
      hours:
        description: 'Override max hours since posted (blank = use profile.json)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: daily-jobs
  cancel-in-progress: false

jobs:
  scrape-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Verify profile.json exists
        shell: bash
        run: |
          if [[ ! -f profile.json ]]; then
            echo '::error::profile.json not found in repository root.'
            exit 1
          fi

      - name: Validate email configuration
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        shell: bash
        run: |
          if [[ -z "$GMAIL_USER" || -z "$GMAIL_APP_PASSWORD" || -z "$EMAIL_TO" ]]; then
            echo '::error::Missing GMAIL_USER, GMAIL_APP_PASSWORD, or EMAIL_TO GitHub Actions secret.'
            exit 1
          fi

      - name: Run scraper
        id: scrape
        env:
          CHROME_BINARY: /usr/bin/google-chrome-stable
          PYTHONUNBUFFERED: '1'
          HOURS_OVERRIDE: ${{ inputs.hours || '' }}
          FULL_RUN: ${{ inputs.full_run || false }}
        shell: bash
        run: |
          args=(--profile profile.json)
          if [[ -n "$HOURS_OVERRIDE" ]]; then
            if [[ ! "$HOURS_OVERRIDE" =~ ^[0-9]+$ ]] || (( HOURS_OVERRIDE < 1 || HOURS_OVERRIDE > 8760 )); then
              echo '::error::hours must be an integer between 1 and 8760.'
              exit 1
            fi
            args+=(--hours "$HOURS_OVERRIDE")
          elif [[ "$FULL_RUN" == 'true' ]]; then
            args+=(--hours 48)
          fi

          xvfb-run --auto-servernum --server-args='-screen 0 1280x720x24' \
            uv run python scrape.py "${args[@]}"

          if ! compgen -G 'jobs/ranked-jobs_*.csv' > /dev/null; then
            echo '::error::Scraper completed without producing a ranked jobs CSV.'
            exit 1
          fi

      - name: Send email digest
        if: ${{ steps.scrape.outcome == 'success' }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: uv run python email_digest.py --profile profile.json

      - name: Upload jobs artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: jobs
          path: jobs/
          if-no-files-found: warn
          retention-days: 7
